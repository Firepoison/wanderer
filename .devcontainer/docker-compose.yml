version: "0.1"

services:
  db:
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-new:/var/lib/postgresql/data

  wanderer:
    environment:
      PORT: 4444
      DB_HOST: db
      WEB_APP_URL: "http://localhost:4444"
      ERL_AFLAGS: "-kernel shell_history enabled"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 4444:4444
    volumes:
      - ..:/app:delegated
      # Dependency and build trees live on Linux volumes layered over the bind mount. On Docker
      # Desktop for Windows the bind mount is a 9p share where every file stat is slow, and
      # Phoenix's code reloader stats all of deps/ and _build/ on each request (~10s per page).
      # Mounting them in place keeps paths like assets/package.json's "file:../deps/phoenix" working.
      - wanderer-deps:/app/deps
      - wanderer-build:/app/_build
      - wanderer-node-modules:/app/assets/node_modules
      - ~/.gitconfig:/root/.gitconfig
      - ~/.gitignore:/root/.gitignore
      - ~/.ssh:/root/.ssh
      - elixir-artifacts:/opt/elixir-artifacts
    command: sleep infinity

volumes:
  elixir-artifacts: {}
  wanderer-deps: {}
  wanderer-build: {}
  wanderer-node-modules: {}
  db-new: {}
